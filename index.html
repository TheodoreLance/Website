<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KILTURA — Theodore Lance</title>
  <meta name="description" content="KILTURA by Theodore Lance — a scroll-driven visual experience." />

  <style>
    @font-face {
      font-family: 'Replica LL TT';
      src: url('ReplicaLLTT-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'ReplicaLLTT-Bold';
      src: url('ReplicaLLTT-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #eb3925;
      --dark-red: #c92c17;
      --dark-red-hover: #b42311;
      --p: 0; /* Total vertical scroll progress: 0.0 -> 2.0 */
      --p1: 0; /* Phase 1 progress (0.0 Logo -> 1.0 Boxes) */
      --p2: 0; /* Phase 2 progress (0.0 Boxes -> 1.0 Squeezed Up Contact Section) */
      --px: 0; /* Horizontal swipe progress on first page: 0.0 (Closed) -> 1.0 (Color Selection Fully Open) */
      --gap-v: calc(14 / 576 * 100vh); /* Vertical gap matching horizontal gap between boxes */
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg);
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg);
    }

    /*
      Logo Container (Top):
      Starts tall at p=0 and compresses against top margin as boxes rise vertically.
      When swiping left horizontally (increasing --px), its width smoothly scales down
      from 992px to 787px (1024 - 187 - 17 - 14 - 19) to make room for the color box!
    */
    .logo-wrap {
      position: absolute;
      left: calc(19 / 1024 * 100vw);
      width: calc((992 - 205 * var(--px)) / 1024 * 100vw);
      top: calc(17 / 576 * 100vh);
      height: max(0px, calc((558 + (17 - 558) * var(--p1) - 17) / 576 * 100vh - var(--gap-v)));
      overflow: hidden;
      pointer-events: none;
      will-change: height, width, opacity;
      opacity: calc(1 - var(--p1) * var(--p1));
    }

    .logo-wrap svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .logo-cls {
      fill: var(--dark-red);
    }

    /*
      Boxes:
      Box 1 & 2: rise from bottom margin (558px) to top margin (17px)
      Box 3: left 820px, width 187px; expands up to 17px,
             bottom maintains exact 14px gap above the top of HOME and CONTACT
    */

    .box {
      position: absolute;
      background-color: var(--dark-red);
      overflow: hidden;
      cursor: pointer;
      will-change: top, bottom, background-color;
      transition: background-color 0.25s ease;
    }

    .box:hover {
      background-color: var(--dark-red-hover);
    }

    .animal {
      position: absolute;
      top: calc(154 / 576 * 100vh);
      height: calc(208 / 576 * 100vh);
      opacity: calc(var(--p1) * max(0, 1 - var(--p2) * 6));
      pointer-events: none;
      will-change: left, top, width, height, opacity;
      transition: left 0.45s cubic-bezier(0.2, 0.9, 0.3, 1),
                  top 0.45s cubic-bezier(0.2, 0.9, 0.3, 1),
                  width 0.45s cubic-bezier(0.2, 0.9, 0.3, 1),
                  height 0.45s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    body:not(.box-1-open):not(.box-2-open):not(.box-3-open) .box-1:hover .animal-chicken,
    body:not(.box-1-open):not(.box-2-open):not(.box-3-open) .box-2:hover .animal-tiger,
    body:not(.box-1-open):not(.box-2-open):not(.box-3-open) .box-3:hover .animal-goat {
      transform: scale(1.04);
    }

    .animal svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .animal-shape {
      fill: var(--bg);
    }

    .animal-chicken {
      left: calc(123 / 1024 * 100vw);
      width: calc(178 / 1024 * 100vw);
      transform-origin: center center;
      transition: left 0.45s cubic-bezier(0.2, 0.9, 0.3, 1),
                  top 0.45s cubic-bezier(0.2, 0.9, 0.3, 1),
                  width 0.45s cubic-bezier(0.2, 0.9, 0.3, 1),
                  height 0.45s cubic-bezier(0.2, 0.9, 0.3, 1),
                  transform 0.25s ease,
                  opacity 0.35s ease;
    }

    .animal-tiger {
      left: calc(82 / 1024 * 100vw);
      width: calc(209 / 1024 * 100vw);
      transform-origin: center center;
      transition: left 0.45s cubic-bezier(0.2, 0.9, 0.3, 1),
                  top 0.45s cubic-bezier(0.2, 0.9, 0.3, 1),
                  width 0.45s cubic-bezier(0.2, 0.9, 0.3, 1),
                  height 0.45s cubic-bezier(0.2, 0.9, 0.3, 1),
                  transform 0.25s ease,
                  opacity 0.35s ease;
    }

    .animal-goat {
      right: calc(15 / 1024 * 100vw);
      width: calc(144 / 1024 * 100vw);
      transform-origin: center center;
      transition: transform 0.25s ease,
                  opacity 0.35s ease;
    }

    .box-1 {
      left: calc(17 / 1024 * 100vw);
      width: calc(388 / 1024 * 100vw);
      top: calc((558 + (17 - 558) * var(--p1)) / 576 * 100vh);
      bottom: calc(18 / 576 * 100vh);
      min-height: 0;
      transition: left 0.45s cubic-bezier(0.2, 0.9, 0.3, 1),
                  width 0.45s cubic-bezier(0.2, 0.9, 0.3, 1),
                  bottom 0.45s cubic-bezier(0.2, 0.9, 0.3, 1),
                  background-color 0.25s ease;
    }

    .box-2 {
      left: calc(419 / 1024 * 100vw);
      width: calc(388 / 1024 * 100vw);
      top: calc((558 + (17 - 558) * var(--p1)) / 576 * 100vh);
      bottom: calc(18 / 576 * 100vh);
      min-height: 0;
      transition: left 0.45s cubic-bezier(0.2, 0.9, 0.3, 1),
                  width 0.45s cubic-bezier(0.2, 0.9, 0.3, 1),
                  bottom 0.45s cubic-bezier(0.2, 0.9, 0.3, 1),
                  background-color 0.25s ease;
    }

    /* Box 1 Open State (Screenshot 1 reference):
       Box 1 expands to 742px wide (x: 17..759).
       Chicken SVG tucks onto the left side at exact screenshot position:
       x = 46px (left: 29px inside box 1), y = 256px, w = 92px, h = 93px.
       Box 2 collapses to 38px strip at left 771px. Tiger is hidden.
    */
    body.box-1-open .box-1 {
      left: calc(17 / 1024 * 100vw);
      width: calc(742 / 1024 * 100vw);
    }

    body.box-1-open .box-1 .animal-chicken {
      left: calc(29 / 1024 * 100vw);
      top: calc(224.5 / 576 * 100vh);
      width: calc(92 / 1024 * 100vw);
      height: calc(93 / 576 * 100vh);
      opacity: 1;
    }

    body.box-1-open .box-2 {
      left: calc(771 / 1024 * 100vw);
      width: calc(38 / 1024 * 100vw);
    }

    body.box-1-open .box-2 .animal-tiger {
      opacity: 0;
      pointer-events: none;
    }

    /* Box 2 Open State (Screenshot 2 reference):
       Box 1 collapses to 40px strip at left 17px. Chicken is hidden.
       Box 2 expands from left 72px to 808px (736px wide).
       Tiger SVG tucks onto the right side at exact screenshot position:
       x = 680px (left: 608px inside box 2), y = 258px, w = 98px, h = 85px.
    */
    body.box-2-open .box-1 {
      left: calc(17 / 1024 * 100vw);
      width: calc(40 / 1024 * 100vw);
    }

    body.box-2-open .box-1 .animal-chicken {
      opacity: 0;
      pointer-events: none;
    }

    body.box-2-open .box-2 {
      left: calc(72 / 1024 * 100vw);
      width: calc(736 / 1024 * 100vw);
    }

    body.box-2-open .box-2 .animal-tiger {
      left: calc(608 / 1024 * 100vw);
      top: calc(228.5 / 576 * 100vh);
      width: calc(98 / 1024 * 100vw);
      height: calc(85 / 576 * 100vh);
      opacity: 1;
    }

    /* Box 3 Open State (Screenshot 3 reference):
       Box 1 collapses to 40px strip at left 17px. Chicken is hidden.
       Box 2 collapses to 40px strip at left 71px. Tiger is hidden.
       Center Goat panel spans from left 125px to 808px (683px wide).
       Box 3 remains at right (left 820px, 187px wide) with goat visible and text hidden.
    */
    .goat-panel {
      display: none;
    }

    body.box-3-open .box-1 {
      left: calc(17 / 1024 * 100vw);
      width: calc(40 / 1024 * 100vw);
    }

    body.box-3-open .box-1 .animal-chicken {
      opacity: 0;
      pointer-events: none;
    }

    body.box-3-open .box-2 {
      left: calc(71 / 1024 * 100vw);
      width: calc(40 / 1024 * 100vw);
    }

    body.box-3-open .box-2 .animal-tiger {
      opacity: 0;
      pointer-events: none;
    }

    /* Box 3 Open State: Box 3 itself expands to span from left 125px to right 1007px (882px wide), above contact bar */
    body.box-3-open .box-3 {
      left: calc(125 / 1024 * 100vw);
      width: calc(882 / 1024 * 100vw);
      bottom: min(calc(559 / 576 * 100vh), calc((109 + 450 * var(--p2)) / 576 * 100vh));
    }

    .animal-text {
      transition: opacity 0.35s ease;
    }

    /* Only hide the text of the expanded section; keep RESUME visible when Box 1 or Box 2 is open */
    body.box-3-open .box-3 .animal-text,
    body.box-1-open .box-1 .animal-text,
    body.box-2-open .box-2 .animal-text {
      opacity: 0;
    }

    /* When menu / contact bar is opened or box-3 is open, Box 1 and Box 2 bottom lifts up to line up above the left-aligned contact bar */
    body.menu-open .box-1,
    body.menu-open .box-2,
    body.box-3-open .box-1,
    body.box-3-open .box-2,
    body.contact-active .box-1,
    body.contact-active .box-2 {
      bottom: min(calc(559 / 576 * 100vh), calc((109 + 450 * var(--p2)) / 576 * 100vh));
    }

    .box-3 {
      left: calc(820 / 1024 * 100vw);
      width: calc(187 / 1024 * 100vw);
      top: calc((558 + (17 - 558) * var(--p1)) / 576 * 100vh);
      bottom: min(calc(559 / 576 * 100vh), calc((18 + 91 * var(--p1) + 450 * var(--p2)) / 576 * 100vh));
      min-height: 0;
      transition: left 0.45s cubic-bezier(0.2, 0.9, 0.3, 1),
                  width 0.45s cubic-bezier(0.2, 0.9, 0.3, 1),
                  bottom 0.45s cubic-bezier(0.2, 0.9, 0.3, 1),
                  background-color 0.25s ease;
    }

    /*
      Hamburger Menu (Bottom Right under Box 3):
      Anchored to bottom margin (18px) at p2=0, rises smoothly with contact bar to top margin (17px) at p2=1.
      When closed: compact solid block (3 bars touching, gap: 0).
      When opened: spreads apart into three lines with gap matching reference image.
    */
    .menu-btn {
      position: absolute;
      left: calc(820 / 1024 * 100vw);
      width: calc(187 / 1024 * 100vw);
      height: calc(73 / 576 * 100vh);
      bottom: calc((18 + 468 * var(--p2)) / 576 * 100vh);
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 55;
      outline: none;
      opacity: var(--p1);
      will-change: opacity, bottom;
    }

    /*
      Contact Me Bar:
      Single unified header row alongside .menu-btn.
      At p2=0: bottom: 18px.
      At p2=1: bottom: 486px (top: 17px).
    */
    .contact-bar {
      position: absolute;
      left: calc(17 / 1024 * 100vw);
      width: calc(590 / 1024 * 100vw);
      bottom: calc((18 + 468 * var(--p2)) / 576 * 100vh);
      height: calc(73 / 576 * 100vh);
      display: flex;
      align-items: stretch;
      z-index: 55;
      text-decoration: none;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: translateY(calc(30 / 576 * 100vh));
      will-change: transform, opacity, left, bottom, width;
      transition: opacity 0.35s ease,
                  transform 0.45s cubic-bezier(0.2, 0.9, 0.3, 1),
                  left 0.45s cubic-bezier(0.2, 0.9, 0.3, 1),
                  width 0.45s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    body.menu-open .contact-bar,
    body.contact-active .contact-bar {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .contact-text-wrap {
      width: 100%;
      height: 100%;
    }

    .contact-bar svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .contact-path {
      fill: var(--dark-red);
      transition: fill 0.25s ease;
    }

    .contact-bar:hover .contact-path {
      fill: var(--dark-red-hover);
    }

    .menu-bar {
      width: 100%;
      height: calc(12 / 576 * 100vh);
      background-color: var(--dark-red);
      flex-shrink: 0;
      will-change: transform, background-color;
      transition: transform 0.45s cubic-bezier(0.2, 0.9, 0.3, 1), background-color 0.25s ease;
    }

    .menu-btn:hover .menu-bar {
      background-color: var(--dark-red-hover);
    }

    /* When closed: bars 1 & 2 shifted down to touch bar 3 at bottom */
    .menu-btn:not(.open) .bar-1 {
      transform: translateY(calc(37 / 576 * 100vh));
    }

    .menu-btn:not(.open) .bar-2 {
      transform: translateY(calc(18.5 / 576 * 100vh));
    }

    .menu-btn:not(.open) .bar-3 {
      transform: translateY(0);
    }

    /* Hover preview when closed: slight 3px spacing */
    .menu-btn:hover:not(.open) .bar-1 {
      transform: translateY(calc(31 / 576 * 100vh));
    }

    .menu-btn:hover:not(.open) .bar-2 {
      transform: translateY(calc(15.5 / 576 * 100vh));
    }

    /* When open: all bars slide to their default spaced positions */
    body.menu-open .menu-bar,
    body.contact-active .menu-bar,
    .menu-btn.open .menu-bar {
      transform: translateY(0);
    }

    /*
      Theme Color Picker Box (Right Side on First Page):
      Matches user reference screenshot:
      Anchored to right (left: 820px at px=1, width: 187px, top: 17px, bottom: 18px).
      Directly tracks horizontal swipe progress (--px):
      As you swipe left, the logo scales down in width and this box scales/reveals into view from the right.
    */
    .theme-drawer {
      position: absolute;
      top: calc(17 / 576 * 100vh);
      bottom: calc(18 / 576 * 100vh);
      left: calc((1024 - 204 * var(--px)) / 1024 * 100vw);
      width: calc(187 / 1024 * 100vw);
      background-color: var(--dark-red);
      z-index: 25;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: calc(30 / 576 * 100vh) calc(16 / 1024 * 100vw);
      opacity: calc(var(--px) * max(0, 1 - var(--p1) * 3));
      will-change: left, opacity;
      transition: background-color 0.3s ease;
    }

    .theme-swatches {
      display: flex;
      flex-direction: column;
      gap: clamp(8px, calc(16 / 576 * 100vh), 22px);
      width: 100%;
      align-items: center;
      margin-top: auto;
      margin-bottom: auto;
    }

    .theme-swatch {
      width: clamp(48px, min(calc(84 / 1024 * 100vw), calc(72 / 576 * 100vh)), 110px);
      height: clamp(48px, min(calc(84 / 1024 * 100vw), calc(72 / 576 * 100vh)), 110px);
      cursor: pointer;
      border: none;
      outline: none;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, var(--swatch-main) 50%, var(--swatch-sec) 50%);
      transition: transform 0.2s cubic-bezier(0.2, 0.9, 0.3, 1), box-shadow 0.2s ease;
      flex-shrink: 0;
    }

    .theme-swatch:hover {
      transform: scale(1.05);
    }

    .theme-swatch.active {
      transform: scale(1.03);
      outline: 3px solid rgba(255, 255, 255, 0.85);
      outline-offset: 3px;
    }

    .swatch-blue {
      --swatch-main: #2140a5;
      --swatch-sec: #182e78;
    }
    .swatch-yellow {
      --swatch-main: #c0d80c;
      --swatch-sec: #8c9e09;
    }
    .swatch-purple {
      --swatch-main: #7b299e;
      --swatch-sec: #581d73;
    }
    .swatch-green {
      --swatch-main: #029b4c;
      --swatch-sec: #016f36;
    }
    .swatch-red {
      --swatch-main: #eb3925;
      --swatch-sec: #da3520;
    }

    .theme-label {
      font-family: 'ReplicaLLTT-Bold', sans-serif;
      font-size: calc(11 / 1024 * 100vw);
      letter-spacing: 0.08em;
      color: var(--bg);
      text-transform: uppercase;
      text-align: center;
      opacity: 0.9;
      user-select: none;
      transition: color 0.3s ease;
    }

    /*
      Smooth Scroll & Animation Sync:
      Disable position/transform transitions while scrolling in phase 2 so the
      JavaScript 60fps lerp drives layout smoothly without fighting CSS transitions.
    */
    body.in-phase-2 .box,
    body.in-phase-2 .contact-bar,
    body.in-phase-2 .menu-btn,
    body.in-phase-2 .contact-modal,
    body.in-phase-2 .animal {
      transition: background-color 0.25s ease !important;
    }

    /*
      ======================================================
      Contact Modal & Form Page (Regular vs Goat Layouts)
      ======================================================
    */
    .contact-modal {
      position: absolute;
      left: calc(17 / 1024 * 100vw);
      width: calc(991 / 1024 * 100vw);
      height: calc(450 / 576 * 100vh);
      top: calc((576 - 468 * var(--p2)) / 576 * 100vh);
      opacity: calc(min(1, var(--p2) * 8));
      z-index: 50;
      padding: 0;
      display: flex;
      flex-direction: column;
      pointer-events: none;
      will-change: top, opacity;
      background: transparent;
    }

    body.contact-active .contact-modal {
      pointer-events: auto;
    }

    /* Main Content Area: Standard consistent layout for all contact opens */
    .contact-modal-content {
      width: 100%;
      height: 100%;
      flex: 1;
      display: flex;
      gap: calc(14 / 1024 * 100vw);
      min-height: 0;
    }

    .contact-main-card {
      background-color: var(--dark-red);
      padding: calc(20 / 576 * 100vh) calc(20 / 1024 * 100vw);
      display: flex;
      gap: calc(20 / 1024 * 100vw);
      width: calc(790 / 1024 * 100vw);
      flex: none;
      transition: background-color 0.3s ease;
    }

    .contact-side-panel {
      width: calc(187 / 1024 * 100vw);
      display: flex;
      flex-direction: column;
      gap: var(--gap-v);
      flex-shrink: 0;
    }

    /* Form Fields Styling */
    .contact-form {
      flex: 1.1;
      display: flex;
      flex-direction: column;
      gap: calc(16 / 576 * 100vh);
      height: 100%;
    }

    .form-field {
      width: 100%;
    }

    .name-field,
    .subject-field {
      height: calc(48 / 576 * 100vh);
    }

    .message-field {
      flex: 1;
      min-height: 0;
    }

    .contact-input,
    .contact-textarea {
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.12);
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      color: var(--bg);
      font-family: 'ReplicaLLTT-Bold', 'Replica LL TT', sans-serif;
      font-size: calc(15 / 1024 * 100vw);
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: calc(10 / 576 * 100vh) calc(14 / 1024 * 100vw);
      outline: none;
      resize: none;
      transition: background-color 0.25s ease, border-color 0.25s ease, color 0.3s ease;
    }

    .contact-input::placeholder,
    .contact-textarea::placeholder {
      color: var(--bg);
      opacity: 0.45;
      font-family: 'ReplicaLLTT-Bold', 'Replica LL TT', sans-serif;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: color 0.3s ease, opacity 0.3s ease;
    }

    .contact-input:focus,
    .contact-textarea:focus {
      background-color: rgba(0, 0, 0, 0.2);
      border-color: rgba(255, 255, 255, 0.28);
    }

    /* Big Dog Send Button */
    .contact-dog-btn {
      flex: 0.9;
      background-color: rgba(0, 0, 0, 0.06);
      border: 1.5px dashed rgba(255, 255, 255, 0.12);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(16 / 576 * 100vh) calc(16 / 1024 * 100vw);
      gap: calc(10 / 576 * 100vh);
      outline: none;
      position: relative;
      overflow: hidden;
      transition: background-color 0.25s ease, border-color 0.25s ease, transform 0.2s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    .contact-dog-btn:hover {
      background-color: rgba(0, 0, 0, 0.15);
      border-color: rgba(255, 255, 255, 0.35);
      transform: scale(1.015);
    }

    .contact-dog-btn:active {
      transform: scale(0.985);
    }

    .dog-svg-wrap {
      width: 75%;
      height: 70%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dog-svg-wrap svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .dog-path {
      fill: var(--bg);
      transition: fill 0.3s ease;
    }

    .dog-send-label {
      font-family: 'ReplicaLLTT-Bold', sans-serif;
      font-size: calc(13 / 1024 * 100vw);
      letter-spacing: 0.1em;
      color: var(--bg);
      font-weight: 700;
      transition: color 0.3s ease;
    }

    /* Right Action Cards */
    .contact-action-btn {
      flex: 1;
      background-color: var(--dark-red);
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
      outline: none;
      position: relative;
      padding: calc(20 / 576 * 100vh);
      text-decoration: none;
      transition: background-color 0.25s ease, transform 0.2s ease;
    }

    .contact-action-btn:hover {
      background-color: var(--dark-red-hover);
      transform: scale(1.03);
    }

    .contact-action-btn svg {
      width: calc(105 / 1024 * 100vw);
      height: calc(105 / 1024 * 100vw);
      max-width: 80%;
      max-height: 80%;
      display: block;
    }

    .action-icon-path {
      fill: var(--bg);
      transition: fill 0.3s ease;
    }

                <path class="dog-path" d="M359.42.7c-4.04-2.56-12.53,2.52-18.47,5.48-40.51,20.16-104.95,9.43-133.78,58.61-13.19,22.51-4.19,63.54-39.32,71.78-35.95,8.43-87.7,11.99-99.85-12.24-9.13-18.2,6.4-39.77,34.24-50.27-21.66-7.96-38.25-.78-57.71,8.97l11.58-17.19c-15.89,2.02-31.56,9.9-39.59,25.46-4.22,8.19-1.66,24.49.47,32.8l-13.32.55c3.72,14.14,8.57,22.36,16.51,31.48l-13.24-1.42,16.85,22.11c-25.59,33.42,6.52,56.17-18.75,70.35l-5.05,30.17c1.71.12,7.32-.42,6.81,1.56l-3.51,13.86,13.02-.82c-.66,1.7-3.3,9.94-.75,11.55l10,6.33,30.62,22.12c7.34,5.3,29.1,4.26,36.47-.85,5.37-28.55-40.14-17.23-27.85-55.6l10.72,19.24,37.58,38.01c25.16,6.87,47.74.52,44.55-9.45-.83-2.58-4.61-9.17-7.13-10.35l-23.69-11.06c-5.41-2.52-9.57-18.07-5.34-22.78l17.98-20.05c22.89,1.21,38.77-1.37,62.21-7.01l-6.42,18.13c2.1.76,10.64,3.92,9.5,6.51l-5.5,12.53c4.27-.64,10.49-2.35,12.38-.08l7.46,8.97,12.06,34.08c12.36,4.04,34.42,3.06,45.12-2.16,3.21-1.56,4.89-13.71,2.24-16.07-13.02-11.6-27.2-10.48-29-29.65-2.05-21.74,1.12-46.39,11.44-64.68,3.39-6,20.56-10.25,26.04-8.26,3.99,6.64,1.9,18.92-3.01,23.75-11.4,11.21-9.16,32.05,5.91,37.06,10.05-2.84,23.4-17.56,26.64-28.43,8.87-29.77,17.85-71.9,2.71-80.25-3.67-2.02-12.31-2.14-17.05-1.64l-18.63,1.98,9.34-65.9,21.68-6.49c13.13-3.93,23.16-9.38,32.84-20.3l2.39-8.35.67-6.78,13.58-35.06c2.77-7.15,2.03-16.01-4.66-20.26ZM259.11,79.65c-8.35,0-15.11-6.77-15.11-15.11s6.77-15.11,15.11-15.11c3.71,0,6.98,1.49,9.61,3.7l.15-.05c.36-.12.6.19.78.68,2.81,2.74,4.57,6.55,4.57,10.78,0,8.35-6.77,15.11-15.11,15.11Z"/>

        <!-- Right Side Action Cards: LinkedIn & Copy Email (Regular layout only) -->
        <div class="contact-side-panel">
          <!-- LinkedIn Link Card -->
          <a href="https://www.linkedin.com/in/theodore-lance-b9097b253" target="_blank" rel="noopener noreferrer" class="contact-action-btn btn-linkedin" title="LinkedIn Profile" aria-label="LinkedIn Profile">
            <svg viewBox="0 0 24 24" preserveAspectRatio="xMidYMid meet">
              <path class="action-icon-path" fill-rule="evenodd" d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
            </svg>
          </a>

          <!-- Copy Email Card -->
          <button type="button" class="contact-action-btn btn-copy-email" id="btnCopyEmail" title="Copy Email Address" aria-label="Copy Email Address">
            <svg viewBox="0 0 130 150" preserveAspectRatio="xMidYMid meet">
              <path class="action-icon-stroke" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"
                d="M 91.5 41.5 V 15 A 8.5 8.5 0 0 0 83 6.5 H 15 A 8.5 8.5 0 0 0 6.5 15 V 99 A 8.5 8.5 0 0 0 15 107.5 H 36.5" />
              <rect class="action-icon-stroke" x="36.5" y="41.5" width="85" height="101" rx="8.5" ry="8.5" stroke-width="13" stroke-linejoin="round" />
            </svg>
            <span class="copy-tooltip" id="copyTooltip">Copied!</span>
          </button>
        </div>

  </main>

  <script>
    (function() {
      const menuBtn = document.getElementById('menuBtn');

      function openMenu() {
        document.body.classList.add('menu-open');
        if (menuBtn) {
          menuBtn.classList.add('open');
          menuBtn.setAttribute('aria-expanded', 'true');
        }
      }

      function hasOpenBox() {
        return document.body.classList.contains('box-1-open') ||
               document.body.classList.contains('box-2-open') ||
               document.body.classList.contains('box-3-open');
      }

      function closeBoxes() {
        document.body.classList.remove('box-1-open', 'box-2-open', 'box-3-open');
      }

      function closeMenu() {
        if (document.body.classList.contains('menu-open') || (menuBtn && menuBtn.classList.contains('open'))) {
          document.body.classList.remove('menu-open');
          if (menuBtn) {
            menuBtn.classList.remove('open');
            menuBtn.setAttribute('aria-expanded', 'false');
          }
        }
        closeBoxes();
      }

      let currentP = 0;
      let targetP = 0;
      let lastReturnedFromContact = 0;
      let lastClosedBoxTime = 0;
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has("p")) {
        currentP = targetP = Math.max(0, Math.min(2, parseFloat(urlParams.get("p"))));
        if (currentP > 1.0) {
          openMenu();
        }
      }
      const initP1 = Math.max(0, Math.min(1, currentP));
      const initP2 = Math.max(0, Math.min(1, currentP - 1));
      document.documentElement.style.setProperty('--p', currentP.toFixed(5));
      document.documentElement.style.setProperty('--p1', initP1.toFixed(5));
      document.documentElement.style.setProperty('--p2', initP2.toFixed(5));
      if (initP2 > 0.005) {
        document.body.classList.add('in-phase-2');
      }
      if (initP2 > 0.5) {
        document.body.classList.add('contact-active');
      }
      const SENSITIVITY = 0.0012;

      // Hamburger Menu Toggle
      if (menuBtn) {
        if (urlParams.get('menu') === 'open') {
          openMenu();
        }
        menuBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          if (currentP > 1.02 || targetP > 1.02) {
            targetP = 1.0;
            closeMenu();
            closeBoxes();
            return;
          }
          const willOpen = !document.body.classList.contains('menu-open');
          if (willOpen) {
            openMenu();
          } else {
            closeMenu();
            closeBoxes();
          }
        });
      }

      const box1 = document.getElementById('box1');
      const box2 = document.getElementById('box2');
      const box3 = document.getElementById('box3');

      if (urlParams.get('box') === '1') {
        document.body.classList.add('box-1-open');
      } else if (urlParams.get('box') === '2') {
        document.body.classList.add('box-2-open');
      } else if (urlParams.get('box') === '3') {
        document.body.classList.add('box-3-open');
        openMenu();
      }

      if (box1) {
        box1.addEventListener('click', function(e) {
          if (currentP < 0.8) return;
          e.stopPropagation();
          if (targetP > 1.2) {
            targetP = 1.0;
            return;
          }
          const isOpen = document.body.classList.contains('box-1-open');
          document.body.classList.remove('box-2-open', 'box-3-open');
          if (isOpen) {
            document.body.classList.remove('box-1-open');
          } else {
            document.body.classList.add('box-1-open');
          }
        });
      }

      if (box2) {
        box2.addEventListener('click', function(e) {
          if (currentP < 0.8) return;
          e.stopPropagation();
          if (targetP > 1.2) {
            targetP = 1.0;
            return;
          }
          const isOpen = document.body.classList.contains('box-2-open');
          document.body.classList.remove('box-1-open', 'box-3-open');
          if (isOpen) {
            document.body.classList.remove('box-2-open');
          } else {
            document.body.classList.add('box-2-open');
          }
        });
      }

      if (box3) {
        box3.addEventListener('click', function(e) {
          if (currentP < 0.8) return;
          e.stopPropagation();
          if (targetP > 1.2) {
            targetP = 1.0;
            return;
          }
          const isOpen = document.body.classList.contains('box-3-open');
          closeBoxes();
          if (isOpen) {
            document.body.classList.remove('box-3-open');
            closeMenu();
          } else {
            document.body.classList.add('box-3-open');
            openMenu();
          }
        });
      }

      // Clicking outside on stage / background closes any open boxes and menu
      const stage = document.getElementById('stage');
      if (stage) {
        stage.addEventListener('click', function(e) {
          if (e.target === stage || e.target.classList.contains('logo-wrap') || e.target.closest('#logoWrap')) {
            if (document.body.classList.contains('box-1-open') || 
                document.body.classList.contains('box-2-open') || 
                document.body.classList.contains('box-3-open') ||
                document.body.classList.contains('menu-open')) {
              closeBoxes();
              closeMenu();
            }
          }
        });
      }

      // Theme Drawer & Color Picker Swatches
      const themeDrawer = document.getElementById('themeDrawer');
      const swatches = document.querySelectorAll('.theme-swatch');

      let currentPx = 0;
      let targetPx = 0;
      if (urlParams.has("px")) {
        currentPx = targetPx = Math.max(0, Math.min(1, parseFloat(urlParams.get("px"))));
      }

      // Check URL param for theme
      const themeParam = urlParams.get('theme');
      if (themeParam) {
        const matchingSwatch = document.querySelector('.swatch-' + themeParam);
        if (matchingSwatch) {
          swatches.forEach(function(s) { s.classList.remove('active'); });
          matchingSwatch.classList.add('active');
          document.documentElement.style.setProperty('--bg', matchingSwatch.getAttribute('data-bg'));
          document.documentElement.style.setProperty('--dark-red', matchingSwatch.getAttribute('data-dark'));
          document.documentElement.style.setProperty('--dark-red-hover', matchingSwatch.getAttribute('data-hover'));
        }
      }

      // Swatches selection
      swatches.forEach(function(swatch) {
        swatch.addEventListener('click', function(e) {
          e.stopPropagation();
          swatches.forEach(function(s) { s.classList.remove('active'); });
          swatch.classList.add('active');

          const newBg = swatch.getAttribute('data-bg');
          const newDark = swatch.getAttribute('data-dark');
          const newHover = swatch.getAttribute('data-hover');

          document.documentElement.style.setProperty('--bg', newBg);
          document.documentElement.style.setProperty('--dark-red', newDark);
          document.documentElement.style.setProperty('--dark-red-hover', newHover);
        });
      });

      // Contact Page Modal Logic (Regular Layout vs Goat Layout)
      const contactBar = document.getElementById('contactBar');
      const contactModal = document.getElementById('contactModal');
      const contactModalClose = document.getElementById('contactModalClose');
      const contactNavHome = document.getElementById('contactNavHome');
      const dogSendBtn = document.getElementById('dogSendBtn');
      const btnCopyEmail = document.getElementById('btnCopyEmail');
      const copyTooltip = document.getElementById('copyTooltip');
      const contactForm = document.getElementById('contactForm');

      function openContactModal() {
        document.body.classList.add('contact-modal-open');
        if (contactModal) {
          contactModal.setAttribute('aria-hidden', 'false');
        }
      }

      function closeContactModal() {
        document.body.classList.remove('contact-modal-open');
        if (contactModal) {
          contactModal.setAttribute('aria-hidden', 'true');
        }
        closeBoxes();
        closeMenu();
      }

      // Check URL param for instant testing (e.g. ?contact=open)
      if (urlParams.get('contact') === 'open' || urlParams.get('contact') === 'true' || urlParams.get('contact') === 'regular' || urlParams.get('contact') === 'goat') {
        openContactModal();
      }

      // Clicking Contact Bar smoothly scrolls to reveal the contact section or returns to boxes
      if (contactBar) {
        contactBar.addEventListener('click', function(e) {
          if (currentP < 1.8 && targetP < 1.8) {
            e.preventDefault();
            e.stopPropagation();
            targetP = 2.0;
          } else {
            e.preventDefault();
            e.stopPropagation();
            targetP = 1.0;
            closeMenu();
            closeBoxes();
          }
        });
      }

      // Clicking Top Close (3 bars on contact page) returns to boxes
      const contactTopClose = document.getElementById('contactTopClose');
      if (contactTopClose) {
        contactTopClose.addEventListener('click', function(e) {
          e.stopPropagation();
          targetP = 1.0;
          closeMenu();
          closeBoxes();
        });
      }

      // Close Contact Modal via top-right hamburger close button
      if (contactModalClose) {
        contactModalClose.addEventListener('click', function(e) {
          e.stopPropagation();
          closeContactModal();
        });
      }

      // Big Dog Send Button Handler
      if (dogSendBtn) {
        dogSendBtn.addEventListener('click', function(e) {
          e.preventDefault();
          const nameVal = document.getElementById('inputName')?.value || '';
          const subjectVal = document.getElementById('inputSubject')?.value || 'Message from Kiltura Website';
          const messageVal = document.getElementById('inputMessage')?.value || '';

          // Visual feedback on send
          dogSendBtn.style.transform = 'scale(0.95)';
          const dogLabel = dogSendBtn.querySelector('.dog-send-label');
          const prevText = dogLabel ? dogLabel.textContent : 'SEND';
          if (dogLabel) dogLabel.textContent = 'SENT!';

          setTimeout(function() {
            dogSendBtn.style.transform = '';
            if (dogLabel) dogLabel.textContent = prevText;
          }, 1800);

          // Open mail client with user input
          const mailto = `mailto:theodore@kiltura.com?subject=${encodeURIComponent(subjectVal)}&body=${encodeURIComponent("From: " + nameVal + "\n\n" + messageVal)}`;
          window.location.href = mailto;
        });
      }

      // Copy Email Button Handler
      if (btnCopyEmail) {
        btnCopyEmail.addEventListener('click', function(e) {
          e.stopPropagation();
          const emailToCopy = 'theodore@kiltura.com';
          const showSuccess = function() {
            if (copyTooltip) {
              copyTooltip.textContent = 'Copied!';
              copyTooltip.classList.add('show');
              setTimeout(function() {
                copyTooltip.classList.remove('show');
              }, 1800);
            }
          };

          if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(emailToCopy).then(showSuccess).catch(fallbackCopy);
          } else {
            fallbackCopy();
          }

          function fallbackCopy() {
            const ta = document.createElement('textarea');
            ta.value = emailToCopy;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            try {
              document.execCommand('copy');
              showSuccess();
            } catch (err) {
              if (copyTooltip) {
                copyTooltip.textContent = emailToCopy;
                copyTooltip.classList.add('show');
                setTimeout(function() {
                  copyTooltip.classList.remove('show');
                }, 2500);
              }
            }
            document.body.removeChild(ta);
          }
        });
      }

      // Mouse Wheel / Trackpad Scroll (Vertical & Horizontal)
      window.addEventListener('wheel', function(e) {
        e.preventDefault();

        // On the first page (p is at or near 0), horizontal trackpad scrolling controls the color selection
        if (currentP <= 0.05 && Math.abs(e.deltaX) > Math.abs(e.deltaY) * 0.7) {
          // Swiping left on trackpad has e.deltaX > 0
          targetPx += e.deltaX * 0.002;
          targetPx = Math.max(0, Math.min(1, targetPx));
          return;
        }

        // If color selection is open on first page and user scrolls vertically down, close color selection first
        if (targetPx > 0 && e.deltaY > 0) {
          targetPx = 0;
        }

        // When in contact page (currentP > 1.02 or targetP > 1.02)
        if (currentP > 1.02 || targetP > 1.02) {
          if (e.deltaY < 0) {
            // Scrolling up returns to 3 boxes and clamps strictly at 1.0 (no overshoot past 3 boxes)
            targetP += e.deltaY * SENSITIVITY;
            targetP = Math.max(1.0, targetP);
            lastReturnedFromContact = Date.now();
            closeBoxes();
          } else {
            targetP += e.deltaY * SENSITIVITY;
            targetP = Math.min(2.0, targetP);
          }
          return;
        }

        // When around 3 boxes page (currentP >= 0.95 && currentP <= 1.05)
        if (currentP >= 0.95 && currentP <= 1.05) {
          if (Date.now() - lastReturnedFromContact < 500) {
            targetP = 1.0;
            return;
          }
          if (Date.now() - lastClosedBoxTime < 450) {
            targetP = 1.0;
            return;
          }
          if (e.deltaY > 0) {
            // Scrolling down into contact page is ONLY allowed when 3 bars are open!
            const isMenuOpen = document.body.classList.contains('menu-open') || (menuBtn && menuBtn.classList.contains('open'));
            if (!isMenuOpen) {
              targetP = 1.0;
              return;
            }
            targetP += e.deltaY * SENSITIVITY;
            targetP = Math.min(2.0, targetP);
            return;
          } else {
            // If any box is open, smoothly close it and stay resting at the 3 boxes page
            if (hasOpenBox()) {
              closeBoxes();
              closeMenu();
              targetP = 1.0;
              lastClosedBoxTime = Date.now();
              return;
            }
            // Scrolling up goes back towards logo
            closeMenu();
            closeBoxes();
            targetP += e.deltaY * SENSITIVITY;
            targetP = Math.max(0, targetP);
            return;
          }
        }

        // When on pages 0 -> 1:
        if (e.deltaY < 0) {
          if (hasOpenBox()) {
            closeBoxes();
            closeMenu();
            targetP = 1.0;
            lastClosedBoxTime = Date.now();
            return;
          }
          closeMenu();
          closeBoxes();
        }
        targetP += e.deltaY * SENSITIVITY;
        targetP = Math.max(0, Math.min(1.0, targetP));
      }, { passive: false });

      // Touch / Mobile Swipe (Vertical & Horizontal Swipe Left/Right)
      let touchStartX = 0;
      let touchStartY = 0;
      let isHorizontalGesture = null;

      window.addEventListener('touchstart', function(e) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        isHorizontalGesture = null;
      }, { passive: true });

      window.addEventListener('touchmove', function(e) {
        const touchX = e.touches[0].clientX;
        const touchY = e.touches[0].clientY;
        const deltaX = touchStartX - touchX; // Swiping left has deltaX > 0
        const deltaY = touchStartY - touchY; // Swiping up has deltaY > 0

        // When on first page (currentP < 0.1), determine gesture direction
        if (currentP < 0.1 && isHorizontalGesture === null) {
          if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 8) {
            isHorizontalGesture = true;
          } else if (Math.abs(deltaY) > 8) {
            isHorizontalGesture = false;
          }
        }

        if (isHorizontalGesture === true) {
          targetPx += deltaX * 0.005;
          targetPx = Math.max(0, Math.min(1, targetPx));
          touchStartX = touchX;
          e.preventDefault();
          return;
        }

        touchStartY = touchY;

        // When in contact page (currentP > 1.02 or targetP > 1.02)
        if (currentP > 1.02 || targetP > 1.02) {
          if (deltaY < 0) {
            // Swiping down returns to boxes page and stops strictly at 1.0
            targetP += deltaY * 0.0035;
            targetP = Math.max(1.0, targetP);
            lastReturnedFromContact = Date.now();
            closeBoxes();
          } else {
            targetP += deltaY * 0.0035;
            targetP = Math.min(2.0, targetP);
          }
          e.preventDefault();
          return;
        }

        // When resting at boxes page (currentP >= 0.95 && currentP <= 1.05)
        if (currentP >= 0.95 && currentP <= 1.05) {
          if (Date.now() - lastReturnedFromContact < 500) {
            targetP = 1.0;
            e.preventDefault();
            return;
          }
          if (Date.now() - lastClosedBoxTime < 450) {
            targetP = 1.0;
            e.preventDefault();
            return;
          }
          if (deltaY > 0) {
            const isMenuOpen = document.body.classList.contains('menu-open') || (menuBtn && menuBtn.classList.contains('open'));
            if (!isMenuOpen) {
              targetP = 1.0;
              e.preventDefault();
              return;
            }
            targetP += deltaY * 0.0035;
            targetP = Math.min(2.0, targetP);
            e.preventDefault();
            return;
          } else {
            if (hasOpenBox()) {
              closeBoxes();
              closeMenu();
              targetP = 1.0;
              lastClosedBoxTime = Date.now();
              e.preventDefault();
              return;
            }
            closeMenu();
            closeBoxes();
            targetP += deltaY * 0.0035;
            targetP = Math.max(0, targetP);
            e.preventDefault();
            return;
          }
        }

        if (deltaY < 0) {
          if (hasOpenBox()) {
            closeBoxes();
            closeMenu();
            targetP = 1.0;
            lastClosedBoxTime = Date.now();
            e.preventDefault();
            return;
          }
          closeMenu();
          closeBoxes();
        }
        if (deltaY > 0 && targetPx > 0) {
          targetPx = 0;
        }
        targetP += deltaY * 0.0035;
        targetP = Math.max(0, Math.min(1.0, targetP));
        e.preventDefault();
      }, { passive: false });

      // Mouse drag swipe on first page
      let mouseStartX = 0;
      let isMouseDown = false;
      window.addEventListener('mousedown', function(e) {
        if (currentP < 0.1 && (!themeDrawer || !themeDrawer.contains(e.target))) {
          isMouseDown = true;
          mouseStartX = e.clientX;
        }
      });
      window.addEventListener('mousemove', function(e) {
        if (isMouseDown && currentP < 0.1) {
          const deltaX = mouseStartX - e.clientX; // drag left
          if (deltaX > 20) {
            targetPx = Math.min(1, targetPx + 0.08);
          } else if (deltaX < -20) {
            targetPx = Math.max(0, targetPx - 0.08);
          }
          mouseStartX = e.clientX;
        }
      });
      window.addEventListener('mouseup', function() {
        isMouseDown = false;
      });

      // Keyboard arrow keys / navigation
      window.addEventListener('keydown', function(e) {
        // If contact modal is open, Escape closes it
        if (document.body.classList.contains('contact-modal-open')) {
          if (e.key === 'Escape') {
            closeContactModal();
          }
          return;
        }

        if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') {
          e.preventDefault();
          targetPx = 0;
          if (targetP < 1.0) {
            targetP = Math.min(1.0, targetP + 0.2);
          } else if (targetP >= 1.0 && targetP < 2.0) {
            const isMenuOpen = document.body.classList.contains('menu-open') || (menuBtn && menuBtn.classList.contains('open'));
            if (isMenuOpen) {
              targetP = Math.min(2.0, targetP + 0.2);
            }
          }
        } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
          e.preventDefault();
          targetPx = 0;
          if (targetP > 1.02) {
            targetP = Math.max(1.0, targetP - 0.2);
          } else if (hasOpenBox()) {
            closeBoxes();
            closeMenu();
            targetP = 1.0;
            lastClosedBoxTime = Date.now();
          } else {
            closeMenu();
            closeBoxes();
            targetP = Math.max(0, targetP - 0.2);
          }
        } else if (e.key === 'ArrowLeft' && currentP < 0.1) {
          // ArrowLeft swipe left reveals colors
          targetPx = 1;
        } else if (e.key === 'ArrowRight' && currentP < 0.1) {
          // ArrowRight closes colors
          targetPx = 0;
        } else if (e.key === 'Escape') {
          targetPx = 0;
          if (targetP > 1.0) targetP = 1.0;
          closeMenu();
          closeBoxes();
        } else if (e.key === 'Home') {
          e.preventDefault();
          closeMenu();
          closeBoxes();
          targetPx = 0;
          targetP = 0;
        } else if (e.key === 'End') {
          e.preventDefault();
          targetPx = 0;
          targetP = 2;
        }
      });

      // Smooth Animation Loop (Lerp for both Vertical --p and Horizontal --px)
      function tick() {
        // Vertical lerp
        const diffP = targetP - currentP;
        if (Math.abs(diffP) > 0.0001) {
          currentP += diffP * 0.15;
        } else {
          currentP = targetP;
        }
        if (currentP < 0.96) {
          closeMenu();
          closeBoxes();
        }
        const p1 = Math.max(0, Math.min(1, currentP));
        const p2 = Math.max(0, Math.min(1, currentP - 1));

        document.documentElement.style.setProperty('--p', currentP.toFixed(5));
        document.documentElement.style.setProperty('--p1', p1.toFixed(5));
        document.documentElement.style.setProperty('--p2', p2.toFixed(5));

        if (p2 > 0.005) {
          document.body.classList.add('in-phase-2');
        } else {
          document.body.classList.remove('in-phase-2');
        }

        if (p2 > 0.5) {
          document.body.classList.add('contact-active');
        } else {
          document.body.classList.remove('contact-active');
        }

        if (p2 >= 0.9 && document.body.classList.contains('box-3-open')) {
          closeBoxes();
        }

        // Horizontal lerp (color box reveal on first page)
        const diffPx = targetPx - currentPx;
        if (Math.abs(diffPx) > 0.0001) {
          currentPx += diffPx * 0.15;
        } else {
          currentPx = targetPx;
        }
        document.documentElement.style.setProperty('--px', currentPx.toFixed(5));

        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    })();
  </script>
</body>
